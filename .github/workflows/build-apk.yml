name: Build Pat Pet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Read app version from package.json
        id: meta
        run: |
          APP_VER=$(node -p "require('./package.json').version")
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Sync version into app metadata
        run: node scripts/configure-android.js pre

      - name: Add Android platform & sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode Release Keystore (if configured in Secrets)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Patch Android versionCode, versionName & signing config
        env:
          HAS_RELEASE_KEYSTORE: ${{ steps.keystore.outputs.has_keystore }}
        run: node scripts/configure-android.js post

      - name: Build Signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../PatPet-v${{ steps.meta.outputs.version }}.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../PatPet-v${{ steps.meta.outputs.version }}-debug.apk"
          fi

      - name: Upload Versioned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PatPet-v${{ steps.meta.outputs.version }}-apk
          path: PatPet-v${{ steps.meta.outputs.version }}*.apk
