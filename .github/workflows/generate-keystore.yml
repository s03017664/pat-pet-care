name: Generate Android Signing Keystore (One-Time)

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: '請輸入自訂金鑰密碼（至少 6 個英數字，請記低它）'
        required: true
        type: string

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Keystore & Base64
        env:
          KS_PASS: ${{ inputs.keystore_password }}
        run: |
          if [ ${#KS_PASS} -lt 6 ]; then
            echo "錯誤：密碼長度必須至少 6 個字元，請重新執行並輸入更長密碼。"
            exit 1
          fi
          mkdir -p keystore_out
          keytool -genkeypair -v \
            -keystore keystore_out/patpet-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias patpet \
            -storepass "$KS_PASS" \
            -keypass "$KS_PASS" \
            -dname "CN=PatPetCare, OU=Personal, O=PatPet, L=HK, S=HK, C=HK"
          base64 -w 0 keystore_out/patpet-release.jks > keystore_out/ANDROID_KEYSTORE_BASE64.txt
          echo "Keystore generated successfully!"

      - name: Upload Keystore Bundle (Auto-expires in 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: patpet-keystore-bundle
          path: keystore_out/
          retention-days: 1
